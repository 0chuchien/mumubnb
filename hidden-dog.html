    <script>
      let lastScroll = 0;
      const navbar = document.querySelector(".navbar");

      window.addEventListener("scroll", () => {
        const currentScroll = window.scrollY;
        const isMobile = window.innerWidth < 768; // 判斷是否手機寬度

        if (isMobile) {
          // 手機模式：固定白底、不隱藏
          navbar.classList.add("scrolled");
          navbar.classList.remove("hide");
          return; // 直接結束，不跑下面
        }

        // 桌機模式
        if (currentScroll > 10) {
          navbar.classList.add("scrolled");
        }

        if (currentScroll > lastScroll && currentScroll > 10) {
          // 向下滑
          navbar.classList.add("hide");
        } else {
          // 向上滑
          navbar.classList.remove("hide");
        }

        lastScroll = currentScroll;
      });
      // 漢堡選單
      document.addEventListener("DOMContentLoaded", () => {
        const hamburger = document.querySelector(".hamburger");
        const fullMenu = document.getElementById("fullMenu");
        const closeBtn = document.getElementById("closeMenu");

        hamburger.addEventListener("click", () => {
          fullMenu.classList.add("active");
        });
        closeBtn.addEventListener("click", () => {
          fullMenu.classList.remove("active");
        });
      });
    </script>
    <script>
      const images = document.querySelectorAll(".carousel-image");
      const radius = 300;
      const progress = {
        value: 0,
      };
      const carousel = document.querySelector(".carousel");

      Observer.create({
        target: carousel,
        type: "wheel,pointer",
        onPress: (self) => {
          carousel.style.cursor = "grabbing";
        },
        onRelease: (self) => {
          carousel.style.cursor = "grab";
        },
        onChange: (self) => {
          gsap.killTweensOf(progress);
          const p =
            self.event.type === "wheel"
              ? self.deltaY * -0.0005
              : self.deltaX * 0.05;
          gsap.to(progress, {
            duration: 2,
            ease: "power4.out",
            value: `+=${p}`,
          });
        },
      });

      const animate = () => {
        images.forEach((image, index) => {
          const theta = index / images.length - progress.value;
          const x = -Math.sin(theta * Math.PI * 2) * radius;
          const y = Math.cos(theta * Math.PI * 2) * radius;
          image.style.transform = `translate3d(${x}px, 0px, ${y}px) rotateY(${
            360 * -theta
          }deg)`;
          const c = Math.floor((index / images.length) * 360);
        });
      };
      gsap.ticker.add(animate);
    </script>
